name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # Sized for the whole chain, which the end-to-end suite dominates: 18 tests, each
    # rendering the floor through a software WebGL rasteriser because the runner has no
    # GPU, and run one at a time on purpose - parallel workers are CPU-bound and starve
    # each other into their own timeouts, so serial is both faster overall and the only
    # arrangement whose local result predicts this one. That suite went from 9 tests to
    # 18 and now takes some 13 of the 15 minutes this job used to allow, leaving nothing
    # for the install, typecheck, lint, plan check, unit tests and build ahead of it, nor
    # for a retry. 25 restored the margin.
    #
    # 40 now, because this release adds a full room tour to that suite: the e2e leg was
    # already ~13 of the 25 minutes, the tour walks every room rather than a couple of
    # them, and the rest of the chain costs ~5. A run that retries a flaky tour once
    # would pass the old ceiling and go red for a reason that has nothing to do with the
    # code under test - the one failure mode a timeout must never have.
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # The floor plan is the source of truth the model, the drawing and the
      # tests all derive from. If it does not close on its own terms - areas
      # summing to the plot, every dimension chain, jambs, reachability, the
      # stair fit - nothing downstream is worth running, so this gate comes
      # before the unit tests rather than after them.
      - name: Verify the floor plan
        run: pnpm verify:plan

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      # Right after the build, while dist/ is still there and before the browser download:
      # the check is a few seconds of gzipping, and it is the only thing standing between
      # the bundle and the 1.4 MB single chunk it used to be. Budgets: tooling/bundleBudget.ts.
      - name: Check bundle size
        run: pnpm size

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
