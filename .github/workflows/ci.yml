name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    # Sized for the whole chain, which the end-to-end suite dominates: 18 tests, each
    # rendering the floor through a software WebGL rasteriser because the runner has no
    # GPU, and run one at a time on purpose - parallel workers are CPU-bound and starve
    # each other into their own timeouts, so serial is both faster overall and the only
    # arrangement whose local result predicts this one. That suite went from 9 tests to
    # 18 and now takes some 13 of the 15 minutes this job used to allow, leaving nothing
    # for the install, typecheck, lint, plan check, unit tests and build ahead of it, nor
    # for a retry. 25 restores the margin.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      # The floor plan is the source of truth the model, the drawing and the
      # tests all derive from. If it does not close on its own terms - areas
      # summing to the plot, every dimension chain, jambs, reachability, the
      # stair fit - nothing downstream is worth running, so this gate comes
      # before the unit tests rather than after them.
      - name: Verify the floor plan
        run: pnpm verify:plan

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
